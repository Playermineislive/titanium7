# Workflow for building and deploying a Vite/React site to GitHub Pages
name: Deploy Titanium Masterpiece

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          #cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build:client

      - name: SPA 404 Hack
        # This prevents 404 errors when refreshing the page on GitHub Pages
        run: cp dist/spa/index.html dist/spa/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # IMPORTANT: This must match your build output folder
          path: 'dist/spa'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
